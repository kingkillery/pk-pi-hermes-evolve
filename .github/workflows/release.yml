name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: npm ci

      - name: Validate package
        run: |
          npm run typecheck
          npm run python:check
          npm pack --dry-run

      - name: Verify release tag matches package.json
        if: github.event_name == 'release'
        shell: bash
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          # github.event.release.tag_name is the tag that triggered the release.
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          # Accept both "v1.2.3" and "1.2.3" style tags.
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          if [ "$LOCAL_VERSION" != "$NORMALIZED_TAG" ]; then
            echo "::error::Release tag ($RELEASE_TAG -> $NORMALIZED_TAG) does not match package.json version ($LOCAL_VERSION)."
            exit 1
          fi

      - name: Check published version
        id: version
        shell: bash
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view pk-pi-hermes-evolve version 2>/dev/null || true)
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$REMOTE_VERSION" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if release event has no version bump
        # A release event that ends up as a no-op almost always means the author
        # forgot to bump package.json. Surface it as a job failure instead of
        # silently skipping the publish step.
        if: github.event_name == 'release' && steps.version.outputs.already_published == 'true'
        run: |
          echo "::error::Release event fired but package.json version (${{ steps.version.outputs.local }}) is already published on npm. Bump the version before creating a release."
          exit 1

      - name: Publish to npm
        if: steps.version.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish summary
        run: |
          echo "Local version: ${{ steps.version.outputs.local }}"
          echo "Remote version before publish: ${{ steps.version.outputs.remote }}"
          echo "Already published: ${{ steps.version.outputs.already_published }}"
